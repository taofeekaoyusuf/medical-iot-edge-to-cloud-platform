# Anonymous plaintext is deliberate ONLY for the loopback-bound Stage 3 experiment.
# Stage 4 supplies device TLS and ACLs; this harness cannot validate device security.
listener 1883
allow_anonymous true
persistence false
max_connections 1100
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 8192
connection_messages false
log_type warning
log_type error

sys_interval 1
