# Isolated feasibility harness, not the platform's production broker configuration.
name: medical-iot-stage3
services:
  broker:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    ports:
      - "127.0.0.1:18883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "stage3/health", "-m", "probe", "-q", "1"]
      interval: 2s
      timeout: 2s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
